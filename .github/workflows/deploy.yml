name: Build and Deploy

on:
  push:
    branches:
      - main  # Agar aapki default branch 'master' hai toh yahan 'master' kar dein

# GitHub Actions bot ko Pages deploy karne ki permissions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obfuscate and Process .mt file
        run: |
          npm install -g javascript-obfuscator
          if [ -f "script.mt" ]; then
            javascript-obfuscator script.mt --output script.js --compact true --self-defending true
            echo "Successfully obfuscated script.mt into script.js"
          else
            echo "Error: script.mt file not found!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
