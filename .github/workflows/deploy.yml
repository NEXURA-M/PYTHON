name: Build and Deploy

on:
  push:
    branches:
      - main  # Ya aapki default branch ka naam

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Process .mt file to .js
        run: |
          # script.mt ko copy karke script.js bana do
          cp script.mt script.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
