<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXURA | Multi-Python Runner</title>
    
    <!-- Favicon & Styles -->
    <link rel="icon" href="https://yt3.ggpht.com/CRdTHCDMWDNbc75cMKKKoII4H_7L6kPB2gRcErgF1IBc7-7uat6PU7BhqaagjgPNUMODFGxudm2A_6s=s953-c-fcrop64=1,13160000ece9ffff-rw-nd-v1">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Configure All Python Files Here -->
    <py-config>
        files = ["main.py", "app.py", "taqi.py", "index_script.py"]
    </py-config>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap');
        :root { --neon: #00f2ff; --bg: #050505; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Outfit', sans-serif; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--glass); border: 1px solid var(--neon); padding: 30px; border-radius: 20px; backdrop-filter: blur(15px); }
        h1 { color: var(--neon); text-align: center; }
        .nav { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; justify-content: center; }
        .nav-btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background: var(--neon); color: #000; }
        #output-box { background: rgba(0,0,0,0.6); padding: 20px; border-radius: 12px; border-left: 4px solid var(--neon); min-height: 100px; }
    </style>
</head>
<body>

<div class="container">
    <h1>NEXURA Python Hub</h1>
    
    <!-- Navigation Bar for Files -->
    <div class="nav">
        <a href="?page=main.py" class="nav-btn">main.py</a>
        <a href="?page=app.py" class="nav-btn">app.py</a>
        <a href="?page=taqi.py" class="nav-btn">taqi.py</a>
        <a href="?page=index_script.py" class="nav-btn">index_script.py</a>
    </div>

    <h3 id="current-page">Loading...</h3>
    <div id="output-box">Executing Python Code...</div>
</div>

<script>
    // URL Parameter se file name fetch karna
    const urlParams = new URLSearchParams(window.location.search);
    let selectedFile = urlParams.get('page') || 'main.py';
    
    document.getElementById('current-page').innerText = "Running File: " + selectedFile;

    // PyScript initialization wait aur run
    document.addEventListener('pyscriptReady', () => {
        executePythonFile(selectedFile);
    });

    // Fallback execution agar PyScript late load ho
    window.addEventListener('load', () => {
        setTimeout(() => {
            executePythonFile(selectedFile);
        }, 1500);
    });

    function executePythonFile(fileName) {
        let moduleName = fileName.replace('.py', '');
        
        if (window.pyscript) {
            pyscript.interpreter.runPython(`
                import importlib
                import sys
                from js import document

                try:
                    mod = importlib.import_module("${moduleName}")
                    importlib.reload(mod)
                    
                    if hasattr(mod, 'run'):
                        result = mod.run()
                    else:
                        result = f"File '${fileName}' loaded, but 'def run():' function not found."
                        
                    document.getElementById('output-box').innerHTML = str(result)
                except Exception as e:
                    document.getElementById('output-box').innerText = f"Error running ${fileName}: {e}"
            `);
        }
    }
</script>

</body>
</html>
