<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra Moon AI Matrix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 90%; max-width: 800px; height: 85vh; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { background: #0f172a; padding: 20px; text-align: center; border-bottom: 1px solid #334155; }
        .header h1 { color: #38bdf8; font-size: 1.5rem; }
        .header p { color: #94a3b8; font-size: 0.85rem; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; }
        .user-msg { background: #0284c7; align-self: flex-end; color: #fff; }
        .bot-msg { background: #334155; align-self: flex-start; color: #f8fafc; }
        .input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
        button { padding: 12px 24px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>LYRA MOON AI ENGINE</h1>
            <p>Master Developer: Muhammad Taqi King</p>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">Core matrix online. How may I assist you?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Send transmission query..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const text = input.value.strip ? input.value.strip() : input.value.trim();
            
            if(!text) return;

            chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                chatBox.innerHTML += `<div class="message bot-msg">${data.response}</div>`;
            } catch (err) {
                chatBox.innerHTML += `<div class="message bot-msg">Transmission Error.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKey(e) { if(e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
