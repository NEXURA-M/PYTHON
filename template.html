<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXURA | {{TITLE}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        :root {
            --neon-cyan: #00f2ff;
            --bg-dark: #050505;
            --glass-card: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(0, 242, 255, 0.2);
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--glass-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            padding: 40px;
            border-radius: 24px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.08);
            text-align: center;
        }

        h1 { color: var(--neon-cyan); font-size: 2.2rem; margin-top: 0; }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: var(--neon-cyan);
            color: #000;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        {{CONTENT}}
    </div>

    <!-- Hidden Redirection Security Engine -->
    <script>
        function openSecureLink(encodedUrl) {
            // Decodes URL dynamically at runtime only when button is clicked
            let realUrl = atob(encodedUrl);
            window.open(realUrl, '_blank');
        }
    </script>
</body>
</html>
